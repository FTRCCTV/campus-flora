<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f1"><title>植迹 · 校园植物观察手记</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="shell bar"><a class="brand" href="#explore"><span class="logo">❧</span><strong>植迹</strong><small>校园植物手记</small></a><nav><a href="#explore" id="ne">植物探索</a><a href="#garden" id="ng">我的植物园 <b id="qty">0</b></a><button id="account" class="loginBtn">账号</button></nav></div></header>
<main class="shell"><section id="explore">
<div class="field-hero"><div class="field-copy"><div class="eyebrow">CAMPUS HERBARIUM</div><h1>一株植物，<br>一页校园手记。</h1><p>拍下叶片或花朵，辨认物种，<br>亲手为它挑选花园里的位置。</p><div class="actions"><button class="primary" id="shoot"><span data-icon="camera"></span>拍照识植</button><button class="light" id="album"><span data-icon="image"></span>选择照片</button></div></div>
<div class="exhibit"><div class="exhibit-grid"></div><div class="exhibit-top">植株观察台</div><button id="heroPlant" class="exhibit-model" aria-label="查看展示植株"><canvas id="heroCanvas"></canvas></button><div class="exhibit-foot"><div><h2 id="heroName"></h2><i id="heroLatin"></i><p id="heroNote"></p></div><button class="smallBtn" id="heroNext">换一株 ↻</button></div></div></div>
<div class="sectionTitle"><div><div class="eyebrow" id="homeKicker">PLANTING LIBRARY</div><h2 id="homeTitle">选一株开始试种</h2></div><a class="home-link" href="#garden">进入我的花园</a></div><div id="atlas" class="starter-grid"></div></section>
<section id="garden" hidden><div class="sectionTitle"><div><div class="eyebrow">MY CONSERVATORY</div><h1>我的植物园</h1></div><button class="primary" id="add">＋ 记录植物</button></div>
<div class="zones" id="zones" aria-label="种植区域"></div>
<div class="garden-stage" id="stage"><canvas id="world" tabindex="0" aria-label="室外花园，方向键旋转，加减键缩放"></canvas><div class="room" id="room"><button class="window" id="windowView" aria-label="进入室外植物园"><span>推窗逛花园</span></button><div class="wall-art" aria-hidden="true">❧</div><div class="shelf"></div><div class="room-books" aria-hidden="true"><b></b><b></b><b></b></div><div class="toolcup" aria-hidden="true"><b></b><b></b></div><div class="pots" id="pots"></div></div><div class="scene-title"><small>CAMPUS CONSERVATORY</small><strong id="sceneLabel"></strong></div><div class="scene-controls"><button id="returnRoom">返回室内</button><button id="smaller" aria-label="缩小">−</button><button id="larger" aria-label="放大">＋</button><button id="resetView">复位</button></div></div>
<div class="sectionTitle"><div><div class="eyebrow">FIELD NOTES</div><h2>观察手记</h2></div><button class="smallBtn" id="trial">从图鉴试种</button></div><div id="records" class="cards"></div></section>
<footer><span>植迹 · 中国农业大学校园植物手记</span><i>Campus Herbarium</i></footer></main>
<input type="file" accept="image/*" capture="environment" hidden id="cam"><input type="file" accept="image/*" hidden id="file"><dialog id="modal"><button id="close" aria-label="关闭">×</button><div id="content"></div></dialog><div id="toast" role="status"></div>
<script src="botany.js"></script><script src="profile.js"></script><script src="collection.js"></script><script src="specimen.js"></script><script src="garden.js"></script><script src="account.js"></script><script src="app.js"></script></body></html>
