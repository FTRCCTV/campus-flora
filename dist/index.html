<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#213e35"><title>植迹 · 校园植物观察手记</title><link rel="stylesheet" href="style.css"></head><body>
<dialog id="bookIntro" aria-label="翻开植迹植物手记">
  <div class="intro-book" aria-hidden="true">
    <div class="book-paper"></div><div class="turning-sheet"></div>
    <div class="book-lid"><div class="cover-face"><i>Campus Herbarium</i><strong>植迹</strong><span>校园植物观察手记</span><canvas id="coverPrint"></canvas></div><div class="cover-inside"></div></div>
  </div>
  <button type="button" id="skipIntro" autofocus>跳过动画</button>
</dialog>
<script src="botany.js"></script><script src="notebook.js"></script>
<header><div class="shell bar"><a class="brand" href="#explore"><span class="logo">❧</span><strong>植迹</strong><small>校园植物手记</small></a><nav><a href="#explore" id="ne">植物探索</a><a href="#garden" id="ng">我的植物园 <b id="qty">0</b></a><button id="account" class="loginBtn">账号</button></nav></div></header>
<main class="shell"><section id="explore">
<div class="field-hero"><div class="field-copy"><canvas id="fieldPrint" aria-hidden="true"></canvas><div class="eyebrow">Campus Herbarium</div><h1>校园植物<br>观察手记</h1><p>拍下校园里遇见的植物，<br>把它种进自己的花园。</p><div class="actions"><button class="primary" id="shoot"><span data-icon="camera"></span>拍照识植</button><button class="light" id="album"><span data-icon="image"></span>选择照片</button></div></div>
<div class="exhibit"><div class="exhibit-grid"></div><div class="exhibit-top">植株观察台</div><button id="heroPlant" class="exhibit-model" aria-label="查看展示植株"><canvas id="heroCanvas"></canvas></button><div class="exhibit-foot"><div><h2 id="heroName"></h2><i id="heroLatin"></i><p id="heroNote"></p></div><button class="smallBtn" id="heroNext">换一株 ↻</button></div></div></div>
<div class="sectionTitle"><div><div class="eyebrow" id="homeKicker">PLANTING LIBRARY</div><h2 id="homeTitle">选一株开始试种</h2></div><a class="home-link" href="#garden">进入我的花园</a></div><div id="atlas" class="starter-grid"></div></section>
<section id="garden" hidden><div class="sectionTitle"><div><div class="eyebrow">MY CONSERVATORY</div><h1 id="gardenTitle">我的植物园</h1></div><div class="actions"><button class="light" id="friends">我的花友</button><button class="primary" id="backGarden" hidden>回我的花园</button><button class="primary" id="add">＋ 记录植物</button></div></div>
<div class="zones" id="zones" aria-label="种植区域"></div>
<div class="studioBar"><label>场景<select id="sceneChoice"></select></label><label>天气<select id="weatherChoice"></select></label><div class="studioActions"><button class="light" id="layoutMode" aria-pressed="false">布置花园</button><button class="light" id="cancelLayout" hidden>取消布置</button><button class="light" id="photoMode">花园拍照</button></div></div>
<div class="garden-stage outside studioStage" id="stage"><canvas id="world" tabindex="0" aria-label="三维花园。左右拖动环绕，上下拖动调整俯仰。使用方向键调整视角，加减键缩放。"></canvas><button type="button" id="rotateHandle" role="slider" aria-label="旋转选中物品" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0" title="拖动旋转；方向键微调" hidden>⟳</button><canvas id="studioWeather" aria-hidden="true"></canvas><div class="scene-title"><strong id="sceneLabel"></strong></div><div id="gardenModelLoad" class="gardenModelLoad" role="status" hidden>正在细化植物模型…</div><div class="scene-controls"><button id="returnRoom">推窗去室外</button><button id="smaller" aria-label="缩小">−</button><button id="larger" aria-label="放大">＋</button><button id="resetView">复位</button></div><div class="cameraControls" hidden id="cameraControls"><button class="light" id="exitPhoto">退出拍照</button><button class="light" id="cameraLevel">平视</button><button class="light" id="cameraAbove">俯视</button><button class="light" id="cameraPan" aria-pressed="false">平移</button><button class="light" id="cameraWide" aria-label="拉远镜头">−</button><button class="light" id="cameraNear" aria-label="拉近镜头">＋</button><button class="primary" id="shutter">保存照片</button></div></div>
<div id="layoutTools" class="layoutTools" hidden><p>拖动物品移动，拖动选中圆环上的 ⟳ 自由旋转。点空地可放置，拖动空白处可环绕观察。完成后点「保存布置」。</p><div class="studioBar"><label>选中物品<select id="pickObject"></select></label><label id="propSizeControl" hidden>摆件比例<select id="propScale"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><label id="potControl" hidden>花盆材质<select id="potStyle"><option value="clay">赤陶</option><option value="celadon">青瓷</option><option value="basalt">玄武岩</option></select></label><button class="smallBtn" id="removeProp" hidden>移除装饰</button><label>添加装饰<select id="propChoice"></select></label><button class="light" id="addProp">摆入场景</button></div><p role="status" id="layoutStatus"></p></div>
<div class="sectionTitle"><div><div class="eyebrow">FIELD NOTES</div><h2 id="notesTitle">观察手记</h2></div><button class="smallBtn" id="trial">从图鉴试种</button></div><div id="records" class="cards"></div></section>
<footer><span>植迹 · 中国农业大学校园植物手记</span><button type="button" id="replayIntro">重看开场</button></footer></main>
<input type="file" accept="image/*" capture="environment" hidden id="cam"><input type="file" accept="image/*" hidden id="file"><dialog id="modal"><button id="close" aria-label="关闭">×</button><div id="content"></div></dialog><div id="toast" role="status"></div>
<script src="profile.js"></script><script src="layout.js"></script><script src="collection.js"></script><script src="photo-palette.js"></script><script src="specimen.js"></script><script src="setpieces.js"></script><script src="studio-scene.js"></script><script src="habitat.js"></script><script src="studio-depth.js"></script><script src="studio-renderer.js"></script><script src="studio-weather.js"></script><script src="studio-draft.js"></script><script src="studio.js"></script><script src="account.js"></script><script src="friends.js"></script><script src="app.js"></script></body></html>
