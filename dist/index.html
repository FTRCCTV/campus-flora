<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f5"><title>植迹 · 农大校园植物手记</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="shell bar"><a class="brand" href="#explore"><span class="logo">❧</span><strong>植迹</strong><small>校园植物手记</small></a><nav><a href="#explore" id="ne">植物探索</a><a href="#garden" id="ng">我的植物园 <b id="qty">0</b></a></nav></div></header>
<main class="shell"><section id="explore"><div class="hero"><div class="heroArt"><canvas id="heroCanvas" aria-label="银杏枝叶的植物学插画" role="img"></canvas><i>Ginkgo biloba L.</i></div><div class="heroCopy"><div class="eyebrow"><span></span> CAMPUS FIELD NOTES</div><h1>遇见校园里的<br><em>每一片绿意。</em></h1><p>拍下身边的植物，辨认它的名字，<br>把每一次相遇收进你的专属植物园。</p><div class="actions"><button class="primary" id="shoot"><span data-icon="camera"></span>拍照识植</button><button class="light" id="album"><span data-icon="image"></span>从相册选择</button></div></div></div>
<div class="sectionTitle"><div><div class="eyebrow">BOTANICAL ATLAS</div><h2>校园植物图鉴</h2></div><span class="meta">本期收录 <b>03</b> 种</span></div><div class="cards" id="atlas"></div></section>
<section id="garden" hidden><div class="sectionTitle"><div><div class="eyebrow">MY HERBARIUM</div><h1>我的植物园</h1><p>珍藏在这台设备上的校园观察记录。</p></div><button class="primary" id="add">＋ 记录植物</button></div><div id="records" class="cards"></div></section>
<footer><span>植迹 · 中国农业大学校园植物手记</span><i>Campus Herbarium</i></footer></main>
<input type="file" accept="image/*" capture="environment" hidden id="cam"><input type="file" accept="image/*" hidden id="file"><dialog id="modal"><button id="close" aria-label="关闭">×</button><div id="content"></div></dialog><div id="toast" role="status"></div>
<script src="botany.js"></script><script src="recognize.js"></script><script src="app.js"></script></body></html>
